bg        = 0x001C2023
fg        = 0x00C0C8CF
border_fg = 0x003A4044
error_bg  = 0x001C2023
error_fg  = 0x01C4A98A

clock               = %I:%M
hide_version_string = true
hide_key_hints      = true
hide_keyboard_locks = true
blank_box           = false
text_in_center      = false

allow_empty_password = true
save                 = true
default_input        = password
full_color           = true
animation            = none
numlock              = false
input_len            = 34

x_cmd   = /usr/bin/X -quiet
xinitrc  = ~/.xinitrc

restart_cmd  = /sbin/shutdown -r now
shutdown_cmd = /sbin/shutdown -h now
restart_key  = F2
shutdown_key = F1

tty = 1
