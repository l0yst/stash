# ── backend ──────────────────────────────────────────────────
backend = "egl";
vsync = true;
dithered-present = false;
use-damage = true;

detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
unredir-if-possible = true;
unredir-if-possible-delay = 0;

# ------------ blur ---------------
blur: {
  method = "none";
};

# ── corners ──────────────────────────────────────────────────
corner-radius = 8;

# ── shadows ──────────────────────────────────────────────────
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.6;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-color = "#000000";


# ── fading ───────────────────────────────────────────────────
fading = false;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;
no-fading-openclose = false

animations = (
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.20;
  }
);

rules = (

  { match = "!focused";
    shadow = false;
  },

  { match = "window_type = 'desktop'";
    shadow = false; fade = false; corner-radius = 0; },

  { match = "window_type = 'dock'";
    shadow = false; fade = false; corner-radius = 0; },

  { match = "window_type = 'tooltip'";
    shadow = true;
    corner-radius = 0;
    animations = ({
      triggers = [ "open", "show" ];
      preset = "appear";
      scale = 0.90;
      duration = 0.12;
    }, {
      triggers = [ "close", "hide" ];
      preset = "disappear";
      scale = 0.96;
      duration = 0.08;
    });
  },

  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    shadow = false; fade = false; corner-radius = 0;
    animations = ({
      triggers = [ "open", "show" ];
      preset = "appear";
      scale = 0.90;
      duration = 0.12;
    }, {
      triggers = [ "close", "hide" ];
      preset = "disappear";
      scale = 0.96;
      duration = 0.08;
    });
  },

  { match = "window_type = 'dialog'";
    animations = ({
      triggers = [ "open", "show" ];
      preset = "appear";
      scale = 0.94;
      duration = 0.16;
    }, {
      triggers = [ "close", "hide" ];
      preset = "disappear";
      scale = 0.94;
      duration = 0.10;
    });
  },

  { match = "window_type = 'notification'";
    shadow = true;
    corner-radius = 10;
    animations = ({
      triggers = [ "open", "show" ];
      preset = "slide-in";
      direction = "right";
      duration = 0.16;
    }, {
      triggers = [ "close", "hide" ];
      preset = "slide-out";
      direction = "right";
      duration = 0.10;
    });
  },

  { match = "window_type = 'normal'";
    animations = ({
      triggers = [ "open", "show" ];
      preset = "slide-in";
      direction = "down";
      duration = 0.18;
    }, {
      triggers = [ "close", "hide" ];
      preset = "slide-out";
      direction = "down";
      duration = 0.14;
    });
  },

  { match = "fullscreen";
    corner-radius = 0; shadow = false; fade = false; unredir = true; },

  { match = "_GTK_FRAME_EXTENTS@";
    shadow = false; },

  { match = "class_g = 'zen' && window_type = 'utility'";
    shadow = false; corner-radius = 0; },

  { match = "class_g = 'Rofi'";
    shadow = true;
    corner-radius = 13;
  },
  { match = "window_type = 'popup_menu' && class_g = 'awesome'";
    shadow = true;
    corner-radius = 12;
    },
);
