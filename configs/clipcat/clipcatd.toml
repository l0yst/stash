server_endpoint = "/run/user/1000/clipcat/grpc.sock"
grpc_max_message_size = 4194304

daemonize = true
pid_file = "/run/user/1000/clipcatd.pid"
primary_threshold_ms = 5000
max_history = 30
synchronize_selection_with_clipboard = true
history_file_path = "/home/loyst/.cache/clipcat/clipcatd-history"

[log]
emit_journald = false
emit_stdout = false
emit_stderr = false
level = "WARN"

[watcher]
enable_clipboard = true
enable_primary = true
enable_secondary = false
sensitive_mime_types = ["x-kde-passwordManagerHint"]
filter_text_min_length = 2
filter_text_max_length = 500000
capture_image = false
filter_image_max_size = 1048576

[grpc]
enable_http = false
enable_local_socket = true
local_socket = "/run/user/1000/clipcat/grpc.sock"

[dbus]
enable = false

[metrics]
enable = false

[desktop_notification]
enable = false
